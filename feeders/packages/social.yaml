# Shared vocabulary for public posts (Reddit, Hacker News and any later forum).
package: social
title: Shared vocabulary for public posts
description: >-
  A post is stored with its title, link and community, never with its author. Votes and comments change after a post
  is published, so they are not part of the post: each fetch records them as a separate engagement observation,
  known when it was fetched. That keeps later popularity out of a rewind to the day of the post.
maintainer: synapsis-feeders

event_types:
  - code: TXT.POST
    title: A public post (title and link; the author is not stored)
    place: [logical]
    roles: {mentions: [Vulnerability]}
    text: required
    attributes:
      url: {type: string, max_length: 2000}
      domain: {type: string, max_length: 300}
      flair: {type: string, max_length: 200}
  - code: TXT.POST.ENGAGEMENT
    title: A post's votes and comments as seen on the day it was fetched
    place: [logical]
    measures: [score, engagement]
    attributes:
      post: {type: string, max_length: 300, required: true}

logical_spaces:
  - {space: social.forum, title: Platform then community, kind: tree, max_depth: 2}
