# Global Terrorism Database (START), the 1970-1994 release used in round 2.
package: gtd
title: Global Terrorism Database 1970-1994 (START)
description: >-
  One event per incident in START's Global Terrorism Database release gtd_70to94_0617dist, with its attack type, place,
  perpetrator group and casualties. GTD was compiled after the fact, so knowledge time is the end of the incident's
  day (basis proxy_event_end): rewinds on GTD measure pattern skill, not real-time availability. GTD is distributed by
  START under its terms of use; the feeder reads the same file round 2 used and checks its SHA-256.
maintainer: synapsis-feeders
namespaces:
  records: [gtd]
  entities: [gtd-group]

sources:
  - id: src:start:gtd
    title: Global Terrorism Database, 1970-1994 release (0617dist)
    publisher: National Consortium for the Study of Terrorism and Responses to Terrorism (START), University of Maryland
    url: https://www.start.umd.edu/gtd/
    license: START GTD terms of use (non-commercial research)
    reliability: 85
    reliability_basis: B2
    publication_lag_days: 0
    known_at_rule: End of the incident's day, month or year, matching its precision (basis proxy_event_end).

event_types:
  - code: SEC.ATTACK.ASSASSINATION
    title: Assassination
    place: &gtd_place [point, admin]
    roles: &gtd_roles {actor: [ArmedActor]}
    measures: &gtd_measures [killed, wounded]
    text: optional
    attributes: &gtd_attributes
      gtd_eventid: {type: string, max_length: 20, required: true}
      target_type: {type: string, max_length: 100}
      weapon_type: {type: string, max_length: 100}
      region: {type: string, max_length: 100}
      success: {type: boolean}
      suicide: {type: boolean}
      specificity: {type: integer, min: 1, max: 5}
  - {code: SEC.ATTACK.ARMED_ASSAULT, title: Armed assault, place: *gtd_place, roles: *gtd_roles, measures: *gtd_measures, text: optional, attributes: *gtd_attributes}
  - {code: SEC.ATTACK.BOMBING, title: Bombing or explosion, place: *gtd_place, roles: *gtd_roles, measures: *gtd_measures, text: optional, attributes: *gtd_attributes}
  - {code: SEC.ATTACK.HIJACKING, title: Hijacking, place: *gtd_place, roles: *gtd_roles, measures: *gtd_measures, text: optional, attributes: *gtd_attributes}
  - {code: SEC.ATTACK.HOSTAGE_BARRICADE, title: Hostage taking (barricade incident), place: *gtd_place, roles: *gtd_roles, measures: *gtd_measures, text: optional, attributes: *gtd_attributes}
  - {code: SEC.ATTACK.KIDNAPPING, title: Hostage taking (kidnapping), place: *gtd_place, roles: *gtd_roles, measures: *gtd_measures, text: optional, attributes: *gtd_attributes}
  - {code: SEC.ATTACK.FACILITY, title: Facility or infrastructure attack, place: *gtd_place, roles: *gtd_roles, measures: *gtd_measures, text: optional, attributes: *gtd_attributes}
  - {code: SEC.ATTACK.UNARMED_ASSAULT, title: Unarmed assault, place: *gtd_place, roles: *gtd_roles, measures: *gtd_measures, text: optional, attributes: *gtd_attributes}
  - {code: SEC.ATTACK.UNKNOWN, title: Attack of unknown type, place: *gtd_place, roles: *gtd_roles, measures: *gtd_measures, text: optional, attributes: *gtd_attributes}

measures:
  - {name: killed, title: People killed, unit: count, min: 0}
  - {name: wounded, title: People wounded, unit: count, min: 0}
