# KEV product classes: labels a teacher model produced once in round 3, stored as classification conclusions.
package: kev-classes
title: KEV product classes (teacher labels)
description: >-
  720 products from the KEV catalog placed in 19 functional classes by a one-time teacher model in round 3.
  Each label is a classification conclusion with its method and confidence, never a fact of CISA's. The classes form
  a closed logical space, so an AI producer can only write a registered class (rule A-CLOSED).
maintainer: synapsis-feeders
namespaces:
  records: [kev-classes]

sources:
  - id: src:synapsis:kev-classes
    title: Product classes labelled once by a teacher model
    publisher: Synapsis round 3 (teacher model claude-sonnet-5-5)
    reliability: 90
    reliability_basis: model
    publication_lag_days: 0
    known_at_rule: The day the labels were produced, 2 October 2026.

logical_spaces:
  - space: cyber.product_class
    title: Functional class of a product, then vendor
    max_depth: 2
    closed: true
    values: [BACKUP_STORAGE, BROWSER, DEV_TOOLS, EDGE_VPN, EMAIL_COLLAB, ENTERPRISE_APP, FIREWALL, IDENTITY, IOT_OT,
             LIBRARY, MFT, NETWORK_DEVICE, OFFICE_DOCS, OS, OTHER, RMM_ITSM, SECURITY_SW, VIRTUALIZATION, WEB_APP]
