# Synapsis core: MongoDB, Elasticsearch, Kafka, Neo4j, the embedder, the setup, the API, the relay, the indexer,
# the projector and the web client.
#
#   cp deploy/core/.env.example deploy/core/.env              (first time only)
#   docker compose -f deploy/core/compose.yml up -d --build --wait
#   docker compose -f deploy/core/compose.yml down            (add -v to delete the data too)
#
# Settings: deploy/core/.env, every name starting with CORE_.
# The C# API answers on http://localhost:8080 (Swagger: /swagger) and, for other deployments on the Docker network
# "synapsis", as http://api:8080. It writes records to MongoDB and the ingestion log to Elasticsearch
# (index synapsis-ingest-log, read by the UI). The indexer writes search documents to Elasticsearch (index
# synapsis-records) with vectors from the embedder. Redis and MinIO join this file in the stage that first uses them.

name: synapsis-core

networks:
  default:
    name: synapsis            # a fixed name, so other deployments (the feeders) can reach the API

volumes:
  mongo-data:
  es-data:
  kafka-data:
  neo4j-data:
  models:                     # embedder model weights, downloaded on the first start (about 200 MB)

services:
  mongo:
    image: mongo:7.0.14
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "1"]
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:              # also creates the single-node replica set that transactions need
      test: ["CMD", "mongosh", "--quiet", "--eval",
             "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"        # development only: no login, no TLS
      http.cors.enabled: "true"               # the UI reads the ingestion log from the browser
      http.cors.allow-origin: "http://localhost:1897"
      http.cors.allow-headers: "Content-Type"
      ES_JAVA_OPTS: "-Xms${CORE_ES_HEAP:-1g} -Xmx${CORE_ES_HEAP:-1g}"
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ports: ["9200:9200"]
    volumes: [es-data:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30

  embedder:                   # text models: the indexer turns record texts into vectors (and the search, later, questions)
    image: synapsis/embedder:dev
    build: {context: ../.., dockerfile: src/python/synapsis_embedder/Dockerfile}
    restart: unless-stopped
    environment:
      SEARCH_MODEL: minishlab/potion-retrieval-32M
      MEANING_MODEL: minishlab/potion-base-8M
      RERANK_MODEL: BAAI/bge-small-en-v1.5
      HF_HOME: /models/hf
      FASTEMBED_CACHE_PATH: /models/fastembed
    ports: ["8090:8090"]
    volumes: [models:/models]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 60

  setup:                      # runs once: creates what the stores need when it is missing (indexes, mappings,
                              # constraints, topics), then ends; the C# services start only after it ends successfully
    image: synapsis/setup:dev
    build: {context: ../.., dockerfile: src/dotnet/Synapsis.Setup/Dockerfile}
    restart: "no"
    environment:                                 # addresses and the login; names and other settings: sharedsettings.json
      Mongo__Url: mongodb://mongo:27017/?replicaSet=rs0
      Elastic__Url: http://elasticsearch:9200
      Kafka__Bootstrap: kafka:9092
      Neo4j__Url: bolt://neo4j:7687
      Neo4j__Username: ${CORE_NEO4J_USERNAME:-neo4j}
      Neo4j__Password: ${CORE_NEO4J_PASSWORD:?Set CORE_NEO4J_PASSWORD in deploy/core/.env}
    depends_on:
      mongo: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
      kafka: {condition: service_healthy}
      neo4j: {condition: service_healthy}

  api:                        # the C# API: ingest, records, catalog; Swagger at http://localhost:8080/swagger.
                              # Other deployments (the feeders) reach it as http://api:8080.
    image: synapsis/api:dev
    build: {context: ../.., dockerfile: src/dotnet/Synapsis.Api/Dockerfile}
    restart: unless-stopped
    environment:                                 # addresses only; names and other settings: sharedsettings.json
      Mongo__Url: mongodb://mongo:27017/?replicaSet=rs0
      Elastic__Url: http://elasticsearch:9200     # the ingestion log (index synapsis-ingest-log); Analyze search
      Neo4j__Url: bolt://neo4j:7687                # Analyze: the connections of a point
      Neo4j__Username: ${CORE_NEO4J_USERNAME:-neo4j}
      Neo4j__Password: ${CORE_NEO4J_PASSWORD:?Set CORE_NEO4J_PASSWORD in deploy/core/.env}
      Api__CorsOrigins__0: http://localhost:1897   # the UI may read the API from the browser
      Api__CorsOrigins__1: http://localhost:5173   # the UI's development server
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      setup: {condition: service_completed_successfully}

  mock-api:                   # the read mock: GET /analyze/map, /analyze/graph, /records/{id} from its sample of real
                              # records (no store). Start: docker compose -f deploy/core/compose.yml --profile mock up -d mock-api
    profiles: [mock]
    image: synapsis/mock-api:dev
    build: {context: ../.., dockerfile: src/dotnet/Synapsis.MockApi/Dockerfile}
    restart: unless-stopped
    environment:                                 # the browser addresses of the UI
      Mock__CorsOrigins__0: http://localhost:1897
      Mock__CorsOrigins__1: http://localhost:5173
    ports: ["8081:8081"]

  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    ports: ["9094:9094"]        # from the host (tests, dotnet run): localhost:9094; containers use kafka:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are created by the setup service
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  kafka-relay:
    image: synapsis/kafka-relay:dev
    build: {context: ../.., dockerfile: src/dotnet/Synapsis.KafkaRelay/Dockerfile}
    restart: unless-stopped
    environment:                                 # addresses only; names and other settings: sharedsettings.json
      Mongo__Url: mongodb://mongo:27017/?replicaSet=rs0
      Kafka__Bootstrap: kafka:9092
    depends_on:
      setup: {condition: service_completed_successfully}

  neo4j:
    image: neo4j:5.26.0
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${CORE_NEO4J_USERNAME:-neo4j}/${CORE_NEO4J_PASSWORD:?Set CORE_NEO4J_PASSWORD in deploy/core/.env}
    ports:
      - "7474:7474"                # Neo4j Browser over HTTP
      - "7473:7473"                # Neo4j Browser over HTTPS
      - "7687:7687"                # Bolt used by Neo4j Browser
    volumes: [neo4j-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  neo4j-projector:
    image: synapsis/neo4j-projector:dev
    build: {context: ../.., dockerfile: src/dotnet/Synapsis.Neo4j/Dockerfile}
    restart: unless-stopped
    environment:                                 # addresses and the login; the group id: its appsettings.json
      Mongo__Url: mongodb://mongo:27017/?replicaSet=rs0
      Kafka__Bootstrap: kafka:9092
      Neo4j__Url: bolt://neo4j:7687
      Neo4j__Username: ${CORE_NEO4J_USERNAME:-neo4j}
      Neo4j__Password: ${CORE_NEO4J_PASSWORD:?Set CORE_NEO4J_PASSWORD in deploy/core/.env}
    depends_on:
      setup: {condition: service_completed_successfully}

  elasticsearch-indexer:      # reads new record states from Kafka and writes their search documents to Elasticsearch
    image: synapsis/elasticsearch-indexer:dev
    build: {context: ../.., dockerfile: src/dotnet/Synapsis.Elasticsearch/Dockerfile}
    restart: unless-stopped
    environment:                                 # addresses only; the group id: its appsettings.json
      Mongo__Url: mongodb://mongo:27017/?replicaSet=rs0
      Elastic__Url: http://elasticsearch:9200
      Kafka__Bootstrap: kafka:9092
      Embedder__Url: http://embedder:8090
    depends_on:
      setup: {condition: service_completed_successfully}
      embedder: {condition: service_healthy}

  ui:                         # the web client (React, served by nginx): http://localhost:1897 redirects to /home
    image: synapsis/ui:dev
    build: {context: ../../src/ui}
    restart: unless-stopped
    ports: ["1897:1897"]      # 1897: the year the word "synapse" was coined, from the Greek "synapsis"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:1897/home"]
      interval: 10s
      timeout: 3s
      retries: 10
