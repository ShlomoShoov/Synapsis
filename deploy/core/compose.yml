# Synapsis core: MongoDB, Elasticsearch, the embedder and the API.
#
#   cp deploy/core/.env.example deploy/core/.env              (first time only)
#   docker compose -f deploy/core/compose.yml up -d --build --wait
#   docker compose -f deploy/core/compose.yml down            (add -v to delete the data too)
#
# Settings: deploy/core/.env, every name starting with CORE_. The API answers on http://localhost:8080 and, inside the
# Docker network "synapsis", as http://api:8080. Today the API is the Python stand-in; the C# API (api-next) runs
# beside it on http://localhost:8088 with its own database, until it takes the stand-in's place and address. Kafka, Neo4j, Redis and MinIO join this file in the stage that first uses them.

name: synapsis-core

networks:
  default:
    name: synapsis            # a fixed name, so other deployments (the feeders) can reach the API

volumes:
  mongo-data:
  es-data:
  models:                     # embedder model weights, downloaded on the first start (about 200 MB)

services:
  mongo:
    image: mongo:7.0.14
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "1"]
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:              # also creates the single-node replica set that transactions need
      test: ["CMD", "mongosh", "--quiet", "--eval",
             "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"        # development only: no login, no TLS
      ES_JAVA_OPTS: "-Xms${CORE_ES_HEAP:-1g} -Xmx${CORE_ES_HEAP:-1g}"
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ports: ["9200:9200"]
    volumes: [es-data:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30

  embedder:
    image: synapsis/embedder:dev
    build: {context: ../.., dockerfile: src/python/synapsis_embedder/Dockerfile}
    restart: unless-stopped
    environment:
      SEARCH_MODEL: minishlab/potion-retrieval-32M
      MEANING_MODEL: minishlab/potion-base-8M
      RERANK_MODEL: BAAI/bge-small-en-v1.5
      HF_HOME: /models/hf
      FASTEMBED_CACHE_PATH: /models/fastembed
    ports: ["8090:8090"]
    volumes: [models:/models]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 60

  api-dev:                    # the Python stand-in for the C# API: schemas, ingest, records, semantic search
    image: synapsis/api-dev:dev
    build: {context: ../.., dockerfile: src/python/synapsis_reference/Dockerfile}
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017/?replicaSet=rs0
      MONGO_DB: synapsis
      ES_URL: http://elasticsearch:9200
      EMBEDDER_URL: http://embedder:8090
      SYNAPSIS_API_KEY: ${CORE_API_KEY:-}
    ports: ["8080:8080"]
    networks:
      default:
        aliases: [api]        # the stable address other deployments use: http://api:8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      mongo: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
      embedder: {condition: service_healthy}

  api-next:                   # the C# ingestion server, beside the stand-in: its own port and database
    image: synapsis/api-next:dev
    build: {context: ../.., dockerfile: src/dotnet/Synapsis.Api/Dockerfile}
    restart: unless-stopped
    environment:
      Mongo__Url: mongodb://mongo:27017/?replicaSet=rs0
      Mongo__Database: synapsis_next
      Api__Key: ${CORE_API_KEY:-}
    ports: ["8088:8080"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      mongo: {condition: service_healthy}
