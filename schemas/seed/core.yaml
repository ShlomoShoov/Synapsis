# Core vocabulary. Every source package builds on these codes; only this package may define them.
package: core
title: Synapsis core vocabulary
description: >-
  Closed lists used by the record envelope (time precisions, knowledge-time bases, reliability bases),
  the shared authority namespaces (CVE ids, countries, subdivisions, IMO numbers), the entity types that
  live in them, the roles, measures and conclusion types shared across sources, and the engine's own source.
maintainer: synapsis-platform
namespaces:
  records: [engine]

vocabularies:
  precision: [second, minute, hour, day, week, month, quarter, year]
  known_at_basis: [published, observed, proxy_event_end, proxy_publication_lag, ingested]
  reliability_basis: [A1, A2, A3, A4, A5, A6, B1, B2, B3, B4, B5, B6, C1, C2, C3, C4, C5, C6,
                      D1, D2, D3, D4, D5, D6, E1, E2, E3, E4, E5, E6, F1, F2, F3, F4, F5, F6,
                      measured, analyst, default, model]
  method_by: [human, agent, system]
  # ISO 3166-1 alpha-2, current and former (ISO 3166-3), plus XK for Kosovo
  country: ["AD", "AE", "AF", "AG", "AI", "AL", "AM", "AN", "AO", "AQ", "AR", "AS", "AT", "AU", "AW", "AX", "AZ", "BA",
            "BB", "BD", "BE", "BF", "BG", "BH", "BI", "BJ", "BL", "BM", "BN", "BO", "BQ", "BR", "BS", "BT", "BU", "BV",
            "BW", "BY", "BZ", "CA", "CC", "CD", "CF", "CG", "CH", "CI", "CK", "CL", "CM", "CN", "CO", "CR", "CS", "CT",
            "CU", "CV", "CW", "CX", "CY", "CZ", "DD", "DE", "DJ", "DK", "DM", "DO", "DY", "DZ", "EC", "EE", "EG", "EH",
            "ER", "ES", "ET", "FI", "FJ", "FK", "FM", "FO", "FQ", "FR", "FX", "GA", "GB", "GD", "GE", "GF", "GG", "GH",
            "GI", "GL", "GM", "GN", "GP", "GQ", "GR", "GS", "GT", "GU", "GW", "GY", "HK", "HM", "HN", "HR", "HT", "HU",
            "HV", "ID", "IE", "IL", "IM", "IN", "IO", "IQ", "IR", "IS", "IT", "JE", "JM", "JO", "JP", "JT", "KE", "KG",
            "KH", "KI", "KM", "KN", "KP", "KR", "KW", "KY", "KZ", "LA", "LB", "LC", "LI", "LK", "LR", "LS", "LT", "LU",
            "LV", "LY", "MA", "MC", "MD", "ME", "MF", "MG", "MH", "MI", "MK", "ML", "MM", "MN", "MO", "MP", "MQ", "MR",
            "MS", "MT", "MU", "MV", "MW", "MX", "MY", "MZ", "NA", "NC", "NE", "NF", "NG", "NH", "NI", "NL", "NO", "NP",
            "NQ", "NR", "NT", "NU", "NZ", "OM", "PA", "PC", "PE", "PF", "PG", "PH", "PK", "PL", "PM", "PN", "PR", "PS",
            "PT", "PU", "PW", "PY", "PZ", "QA", "RE", "RH", "RO", "RS", "RU", "RW", "SA", "SB", "SC", "SD", "SE", "SG",
            "SH", "SI", "SJ", "SK", "SL", "SM", "SN", "SO", "SR", "SS", "ST", "SU", "SV", "SX", "SY", "SZ", "TC", "TD",
            "TF", "TG", "TH", "TJ", "TK", "TL", "TM", "TN", "TO", "TP", "TR", "TT", "TV", "TW", "TZ", "UA", "UG", "UM",
            "US", "UY", "UZ", "VA", "VC", "VD", "VE", "VG", "VI", "VN", "VU", "WF", "WK", "WS", "XK", "YD", "YE", "YT",
            "YU", "ZA", "ZM", "ZR", "ZW"]

shared_entity_namespaces:
  - {namespace: cve, entity_type: Vulnerability, key_pattern: "^CVE-[0-9]{4}-[0-9]{4,7}$", title: CVE identifiers}
  - {namespace: country, entity_type: Country, key_pattern: "^[A-Z]{2}$", title: "ISO 3166-1 alpha-2 codes, current or former"}
  - {namespace: subdivision, entity_type: Subdivision, key_pattern: "^[A-Z]{2}-[A-Z0-9]{1,3}$", title: ISO 3166-2 codes}
  - {namespace: imo, entity_type: Vessel, key_pattern: "^IMO[0-9]{7}$", title: IMO ship numbers}

sources:
  - id: src:synapsis:engine
    title: Synapsis engine findings
    publisher: Synapsis
    reliability: 99
    reliability_basis: measured
    publication_lag_days: 0
    known_at_rule: End of the issue week plus the slowest input's publication lag.

entity_types:
  - {code: Country, title: "A country or former country, identified by its ISO 3166-1 alpha-2 code"}
  - {code: Subdivision, title: "A first-level subdivision such as a US state, identified by its ISO 3166-2 code"}
  - {code: Vulnerability, title: "A publicly catalogued vulnerability, identified by its CVE id"}
  - code: Vessel
    title: A ship, identified by its IMO number
    attributes:
      mmsi: {type: string, pattern: "^[0-9]{9}$"}
      flag: {type: string, pattern: "^[A-Z]{2,3}$"}
      ship_type: {type: string, max_length: 120}
  - {code: Organization, title: "A company, agency or other organisation"}
  - {code: ArmedActor, title: A state or non-state armed actor}

roles:
  - {code: subject, title: What the event is about}
  - {code: actor, title: Who carried out the event}
  - {code: target, title: Who or what the event was aimed at}
  - {code: about, title: The place or thing a report or measurement describes}
  - {code: publisher, title: Who published the report}
  - {code: mentions, title: Named in the text of the record}
  - {code: side_a, title: First side of a violent dyad}
  - {code: side_b, title: Second side of a violent dyad}

measures:
  - {name: count, title: Number of occurrences, unit: count, min: 0}
  - {name: engagement, title: Comments or replies at fetch time, unit: count, min: 0}
  - {name: score, title: Votes or points at fetch time, unit: count, signed: true}

conclusion_types:
  - {code: spark, title: An observation the expectation said was unlikely}
  - {code: joint_anomaly, title: A subject unusual on several measures at once}
  - {code: forecast, title: An expectation issued for a future period}
  - {code: similar_pattern, title: "Past windows that looked like this one, and how they continued"}
  - {code: calibrated_estimate, title: A source value corrected by that source's learned bias}
  - {code: classification, title: A subject placed in a closed logical space}
  - {code: link, title: A tested lead-lag connection between two sources}
