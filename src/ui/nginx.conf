# The UI server: serves the built client and the files from assets/ on port 1897.
server {
    listen 1897;
    root /usr/share/nginx/html;
    absolute_redirect off;

    # The site's address is /home.
    location = / {
        return 302 /home;
    }

    # Built code: its names carry a content hash, so browsers may keep it for a year.
    location /app/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Media from assets/media/: byte ranges (video seeking) work by default; revalidated through ETag.
    location /media/ {
        add_header Cache-Control "public, max-age=3600";
    }

    # Every other address is a page of the client: index.html answers, and the router draws the page.
    location / {
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
