openapi: 3.1.0
info:
  title: Synapsis API (Phase 1, the C# ingestion server) and the ingestion log
  version: "1.0"
  description: |
    The routes the C# API answers today (http://localhost:8080; Swagger UI at /swagger), and the ingestion log it writes
    to Elasticsearch, which the UI reads directly (see x-elasticsearch at the end of this file).

    - JSON field names are snake_case. Times are UTC instants such as "2026-10-10T08:15:00Z".
    - Every error has the same body: Error. Its code decides the HTTP status (E-PARAM 400, E-AUTH 401, E-NOT-FOUND 404,
      E-SCHEMA-* 409/422, E-TOO-LARGE 413, E-UNAVAILABLE 503).
    - Writes (PUT /schemas, POST /ingest) need the API key, when one is set, as "Authorization: Bearer <key>" or
      "X-Api-Key: <key>". Reads are open. Browsers may read from the origins in Api:CorsOrigins (the UI: http://localhost:1897).
    - The record format itself (SIL 1.2) is defined in schemas/sil/; the schema package format in
      schemas/sil/schema-package.schema.json.
servers:
  - url: http://localhost:8080

paths:
  /health:
    get:
      summary: Whether the API and MongoDB answer.
      responses:
        "200": {description: 'Plain text "Healthy".', content: {text/plain: {schema: {type: string}}}}
        "503": {description: 'Plain text "Unhealthy": MongoDB does not answer.'}

  /schemas:
    get:
      summary: Every current schema package (read-only list).
      responses:
        "200":
          description: The packages.
          content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/SchemaSummary"}}}}

  /schemas/{package}:
    parameters:
      - {name: package, in: path, required: true, schema: {type: string}, example: kev}
    get:
      summary: One package's current version, its content as JSON.
      responses:
        "200": {description: The package., content: {application/json: {schema: {$ref: "#/components/schemas/Schema"}}}}
        "404": {$ref: "#/components/responses/Error"}
    put:
      summary: Registers a package (feeders only). Adding or widening makes a new version; removing or narrowing is refused.
      security: [{bearer: []}, {apiKey: []}]
      requestBody:
        required: true
        content: {application/yaml: {schema: {type: string}}, application/json: {schema: {type: object}}}
      responses:
        "201": {description: Created (version 1)., content: {application/json: {schema: {$ref: "#/components/schemas/Registration"}}}}
        "200": {description: Updated or unchanged., content: {application/json: {schema: {$ref: "#/components/schemas/Registration"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}

  /ingest:
    post:
      summary: Ingests a batch of SIL records (feeders only). The body may be gzip-compressed (Content-Encoding gzip).
      security: [{bearer: []}, {apiKey: []}]
      parameters:
        - {name: dry_run, in: query, schema: {type: boolean, default: false}, description: Validate and answer without storing or logging.}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sil, batch_id, producer, records]
              properties:
                sil: {const: "1.2"}
                batch_id: {type: string}
                producer: {type: string, example: "feeder:kev"}
                records: {type: array, maxItems: 5000, items: {type: object, description: A SIL record (schemas/sil/).}}
      responses:
        "200": {description: The receipt., content: {application/json: {schema: {$ref: "#/components/schemas/Receipt"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}

  /records/{id}:
    get:
      summary: A record as each source stated it, as known at a date.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}, example: "evt:kev:CVE-2021-44228"}
        - {name: as_of, in: query, schema: {type: string}, description: 'A date ("2024-05-01" = end of that day) or a UTC instant; none = now.'}
        - {name: source, in: query, schema: {type: string}, description: Keep one source only.}
      responses:
        "200": {description: The statements., content: {application/json: {schema: {$ref: "#/components/schemas/Statements"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}

components:
  securitySchemes:
    bearer: {type: http, scheme: bearer}
    apiKey: {type: apiKey, in: header, name: X-Api-Key}

  responses:
    Error:
      description: The request was refused; the code says why.
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string, example: E-NOT-FOUND}
        message: {type: string}
        details:
          type: array
          items: {type: object, required: [path, message], properties: {path: {type: string}, message: {type: string}}}

    SchemaSummary:
      type: object
      required: [name, version, fingerprint]
      properties:
        name: {type: string, example: kev}
        version: {type: integer, example: 3}
        fingerprint: {type: string, description: Changes whenever the package changes.}

    Schema:
      allOf:
        - $ref: "#/components/schemas/SchemaSummary"
        - type: object
          required: [package]
          properties:
            package: {type: object, description: "The package (format: schemas/sil/schema-package.schema.json)."}

    Registration:
      type: object
      required: [status, package, version]
      properties:
        status: {enum: [created, updated, unchanged]}
        package: {type: string}
        version: {type: integer}

    Receipt:
      type: object
      required: [batch_id, status, producer, received_at, counts, rejected, dry_run]
      properties:
        batch_id: {type: string}
        status: {enum: [accepted, partial, rejected, unchanged]}
        producer: {type: string}
        received_at: {type: string, format: date-time}
        counts:
          type: object
          required: [received, new, versioned, unchanged, duplicates, rejected]
          properties:
            received: {type: integer}
            new: {type: integer}
            versioned: {type: integer}
            unchanged: {type: integer}
            duplicates: {type: integer}
            rejected: {type: integer}
        rejected:
          type: array
          items:
            type: object
            required: [index, code, path, message]
            properties:
              index: {type: integer}
              id: {type: [string, "null"]}
              code: {type: string, example: E-UNIT}
              path: {type: string, example: "measures[2].unit"}
              message: {type: string}
        dry_run: {type: boolean}

    Statements:
      type: object
      required: [id, statements]
      properties:
        id: {type: string}
        as_of: {type: [string, "null"]}
        statements:
          type: array
          description: One per source, its latest version known at as_of. Each is the SIL record plus "version" and "_ingest".
          items:
            type: object
            properties:
              version: {type: integer}
              _ingest:
                type: object
                properties:
                  batch_id: {type: string}
                  producer: {type: string}
                  received_at: {type: string, format: date-time}

    IngestLogEntry:
      type: object
      description: |
        One document of the Elasticsearch index "synapsis-ingest-log": what one batch brought from one source. A batch
        whose records name two sources gives two documents. received = new + changed + unchanged + duplicates + rejected.
        Dry runs are not logged. The Elasticsearch type of each field is in x-elasticsearch.mapping.
      required: [timestamp, batch_id, producer, source, received, new, changed, unchanged, duplicates, rejected, rejection_counts, rejections, duration_ms]
      properties:
        timestamp: {type: string, format: date-time, description: When the API received the batch.}
        batch_id: {type: string}
        producer: {type: string, example: "feeder:kev"}
        source: {type: string, example: "src:cisa:kev", description: '"unknown" when a refused record had no readable source.'}
        received: {type: integer}
        new: {type: integer, description: Stored for the first time.}
        changed: {type: integer, description: Stored as a new version.}
        unchanged: {type: integer, description: Already stored as it is.}
        duplicates: {type: integer, description: Exact copies inside the batch, dropped.}
        rejected: {type: integer}
        rejection_counts:
          type: array
          items: {$ref: "#/components/schemas/RejectionCount"}
        rejections:
          type: array
          maxItems: 50
          items:
            type: object
            required: [index, code, path]
            properties:
              index: {type: integer, description: Position in the batch, from 0.}
              id: {type: [string, "null"]}
              code: {type: string}
              path: {type: string}
        duration_ms: {type: integer, description: Time the API took for the whole batch.}

    RejectionCount:
      type: object
      required: [code, count]
      properties:
        code: {type: string, example: E-UNIT}
        count: {type: integer}

x-elasticsearch:
  description: |
    The ingestion log, for the UI to query directly. Elasticsearch: http://localhost:9200 (browser access allowed from
    http://localhost:1897; no login in development). One document per (batch, source), shape: IngestLogEntry above.
    The index is created by the API on the first stored batch; before that, searches answer 404 index_not_found
    (add ?ignore_unavailable=true to get an empty answer instead).
  index: synapsis-ingest-log
  mapping:
    timestamp: {type: date, meaning: When the API received the batch (UTC). Sort and filter on it.}
    batch_id: {type: keyword, meaning: The producer's batch id (exact match).}
    producer: {type: keyword, meaning: 'Who sent the batch, such as "feeder:kev".'}
    source: {type: keyword, meaning: 'The source the records name, such as "src:cisa:kev"; "unknown" for a refused record without one.'}
    received: {type: long, meaning: Records of this source in the batch.}
    new: {type: long, meaning: Stored for the first time.}
    changed: {type: long, meaning: Stored as a new version.}
    unchanged: {type: long, meaning: Already stored as they are; nothing written.}
    duplicates: {type: long, meaning: Exact copies inside the batch, dropped.}
    rejected: {type: long, meaning: Refused with an error code.}
    duration_ms: {type: long, meaning: Time the API took for the whole batch.}
    rejection_counts: {type: nested, fields: {code: keyword, count: long}, meaning: Refused records per error code. Aggregate with a nested aggregation.}
    rejections: {type: object, enabled: false, meaning: 'The first 50 refused records ({index, id, code, path}): returned in _source, not searchable.'}
  queries:
    live_flow:
      description: The newest documents; poll every few seconds with gt = the newest timestamp already shown.
      request: POST /synapsis-ingest-log/_search?ignore_unavailable=true
      body:
        size: 100
        sort: [{timestamp: desc}]
        query: {bool: {filter: [{range: {timestamp: {gt: "2026-10-10T08:00:00.000Z"}}}, {term: {source: "src:cisa:kev"}}]}}
    totals_per_source:
      description: What each source sent over a period (doc_count = number of batches).
      request: POST /synapsis-ingest-log/_search?ignore_unavailable=true
      body:
        size: 0
        query: {range: {timestamp: {gte: "now-24h"}}}
        aggs:
          sources:
            terms: {field: source, size: 500}
            aggs:
              received: {sum: {field: received}}
              new: {sum: {field: new}}
              changed: {sum: {field: changed}}
              unchanged: {sum: {field: unchanged}}
              duplicates: {sum: {field: duplicates}}
              rejected: {sum: {field: rejected}}
    rejections_per_code:
      description: How many records each error code refused over a period (add a term filter on source for one source).
      request: POST /synapsis-ingest-log/_search?ignore_unavailable=true
      body:
        size: 0
        query: {range: {timestamp: {gte: "now-24h"}}}
        aggs:
          codes:
            nested: {path: rejection_counts}
            aggs:
              by_code:
                terms: {field: rejection_counts.code, size: 200}
                aggs: {count: {sum: {field: rejection_counts.count}}}
    records_per_hour:
      description: A time chart of records received per hour, per source.
      request: POST /synapsis-ingest-log/_search?ignore_unavailable=true
      body:
        size: 0
        query: {range: {timestamp: {gte: "now-7d"}}}
        aggs:
          per_hour:
            date_histogram: {field: timestamp, fixed_interval: 1h}
            aggs:
              sources:
                terms: {field: source, size: 50}
                aggs: {received: {sum: {field: received}}}
